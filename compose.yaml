services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-1.0.0}
        COMMIT_SHA: ${COMMIT_SHA:-local-dev}
        BUILD_DATE: ${BUILD_DATE:-}
    image: docker-cicd-pipeline:local
    container_name: docker-cicd-pipeline-web
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
